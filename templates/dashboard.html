<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 20px; }
        .dashboard-container { max-width: 800px; margin: 40px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-align: center; }
        h1 { color: #333; }
        .welcome-msg { font-size: 20px; color: #555; margin-bottom: 30px; }
        .btn-logout { padding: 10px 20px; background-color: #dc3545; color: white; text-decoration: none; border-radius: 4px; font-weight: bold; }
        .btn-logout:hover { background-color: #c82333; }
    </style>
</head>
<body>

<div class="dashboard-container">
    <h1>Dashboard</h1>
    <p class="welcome-msg">Welcome, <strong>{{ name }}</strong>! You have successfully logged in.</p>
    <a href="/logout" class="btn-logout">Logout</a>
</div>

</body>
</html>
